<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intelligence Price Index</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --ink: #1a1a1a; --muted: #6b7280; --line: #e5e7eb;
    --bg: #ffffff; --accent: #111827; --up: #15803d; --down: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    max-width: 1100px; margin: 0 auto; padding: 32px 24px 8px;
  }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .wrap {
    max-width: 1100px; margin: 0 auto; padding: 16px 24px 48px;
    display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: start;
  }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }

  .headline {
    border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px;
  }
  .headline .big { font-size: 34px; font-weight: 700; letter-spacing: -0.02em; }
  .headline .lbl { color: var(--muted); font-size: 13px; }

  .panel { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .panel h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
    margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fafafa;
  }
  .controls { display: flex; gap: 14px; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .controls a { color: #2563eb; font-size: 13px; cursor: pointer; text-decoration: none; }
  .controls a:hover { text-decoration: underline; }

  .row {
    display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center;
    padding: 9px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:hover { background: #fafafa; }
  .row .name { display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .row .meta { text-align: right; font-variant-numeric: tabular-nums; }
  .row .delta { font-weight: 600; font-variant-numeric: tabular-nums; }
  .row .wt { display: block; color: var(--muted); font-size: 11px; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); } .delta.flat { color: var(--muted); }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

  #chart { width: 100%; height: 460px; }
  footer {
    max-width: 1100px; margin: 0 auto; padding: 0 24px 48px; color: var(--muted); font-size: 12.5px;
  }
  footer code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Intelligence Price Index</h1>
  <p class="sub">The revealed price of AI-exposed knowledge work on Fiverr &mdash; monthly, matched-model. Check categories to recompute the basket live.</p>
</header>

<div class="wrap">
  <aside>
    <div class="headline">
      <div class="big" id="headlineNum">&mdash;</div>
      <div class="lbl" id="headlineLbl">trailing 12 months &middot; selected basket</div>
    </div>
    <div class="panel">
      <h2>Categories</h2>
      <div class="controls">
        <a id="selAll">Select all</a><a id="selNone">Select none</a>
      </div>
      <div id="catList"></div>
    </div>
  </aside>
  <main>
    <div id="chart"></div>
  </main>
</div>

<footer id="foot"></footer>

<script src="ipi.js"></script>
</body>
</html>
