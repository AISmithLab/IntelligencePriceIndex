<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intelligence Price Index</title>
  <style>
    :root { --line:#dddddd; --ink:#222; --mut:#777; --link:#0645ad;
            --up:#188038; --down:#c5221f; --hi:#f5f7fa; }
    * { box-sizing: border-box; }
    body { font: 14px/1.45 Arial, Helvetica, "Liberation Sans", sans-serif;
           color: var(--ink); margin: 0; background: #fff; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 18px 60px; }

    header { padding: 22px 0 10px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 24px; margin: 0 0 3px; font-weight: 700; }
    header p { margin: 0; color: var(--mut); font-size: 13px; }

    /* headline / toolbar -------------------------------------------------- */
    .bar { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap;
           padding: 16px 0 10px; }
    .headline .num { font-size: 32px; font-weight: 700; line-height: 1;
                     font-variant-numeric: tabular-nums; }
    .headline .num.up { color: var(--up); } .headline .num.down { color: var(--down); }
    .headline .sub { color: var(--mut); font-size: 12px; margin-top: 3px; }
    .toggles { margin-left: auto; font-size: 13px; color: var(--mut); }
    .toggles a { color: var(--link); cursor: pointer; text-decoration: none; padding: 0 2px; }
    .toggles a:hover { text-decoration: underline; }
    header nav { font-size: 13px; margin-top: 8px; }
    header nav a { color: var(--link); text-decoration: none; }
    header nav a:hover { text-decoration: underline; }

    /* chart --------------------------------------------------------------- */
    #chart { position: relative; width: 100%; }
    #chart svg { display: block; width: 100%; height: auto; }
    .tip { position: absolute; pointer-events: none; background: #fff;
           border: 1px solid var(--line); box-shadow: 0 1px 4px rgba(0,0,0,.12);
           font-size: 12px; padding: 6px 8px; border-radius: 3px; white-space: nowrap;
           display: none; z-index: 5; }
    .tip b { font-weight: 700; } .tip .k { display:inline-block; width:9px; height:9px;
            border-radius:2px; margin-right:5px; vertical-align:-1px; }

    /* table --------------------------------------------------------------- */
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 6px 8px; border-bottom: 1px solid var(--line);
             font-variant-numeric: tabular-nums; }
    thead th { text-align: right; font-weight: 700; font-size: 12px; color: var(--mut);
               border-bottom: 2px solid #ccc; cursor: pointer; user-select: none;
               white-space: nowrap; }
    thead th.l { text-align: left; }
    thead th .arr { color: #aaa; font-size: 10px; }
    td.num { text-align: right; }
    tbody tr.cat:hover { background: var(--hi); }
    .caret { color: var(--mut); cursor: pointer; width: 14px; display: inline-block; }
    .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block;
              vertical-align: -1px; margin-right: 7px; }
    .name { text-transform: capitalize; }
    td.d.up { color: var(--up); } td.d.down { color: var(--down); }
    td.faint { color: var(--mut); }
    tr.detail td { background: #fafafa; color: var(--mut); font-size: 12px; padding: 8px 14px; }
    tr.detail .vals { font-variant-numeric: tabular-nums; line-height: 1.7; }
    tfoot td { border-top: 2px solid #ccc; font-weight: 700; }
    input[type=checkbox] { cursor: pointer; vertical-align: -2px; }
    .spark { vertical-align: middle; }

    .notes { color: var(--mut); font-size: 12px; margin: 18px 0 0; }
    footer { color: #999; font-size: 12px; margin-top: 20px; padding-top: 12px;
             border-top: 1px solid var(--line); }
    footer code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Intelligence Price Index</h1>
      <p>The revealed price of AI-exposed knowledge work &mdash; a matched-model price index of Fiverr gig prices, trailing 12 months.</p>
      <nav><a href="faq.html">FAQ &amp; methodology &rarr;</a></nav>
    </header>

    <div class="bar">
      <div class="headline">
        <div class="num" id="hNum">&mdash;</div>
        <div class="sub">composite, trailing 12&nbsp;months <span id="hRange"></span></div>
      </div>
      <div class="toggles">basket:
        <a id="selAll">All</a> &middot;
        <a id="selNone">None</a>
      </div>
    </div>

    <div id="chart"><div class="tip" id="tip"></div></div>

    <table id="tbl">
      <thead>
        <tr>
          <th class="l" style="width:18px"></th>
          <th class="l" style="width:18px"></th>
          <th class="l" style="width:34px" data-k="rank">#</th>
          <th class="l" data-k="name">Category</th>
          <th class="l" style="width:120px">Trend</th>
          <th data-k="delta">&Delta;12mo</th>
          <th data-k="weight">Weight</th>
          <th data-k="gigs">Gigs</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
      <tfoot id="foot"></tfoot>
    </table>

    <p class="notes" id="caveat"></p>
    <footer id="src"></footer>
  </div>

  <script src="ipi.js"></script>
</body>
</html>
