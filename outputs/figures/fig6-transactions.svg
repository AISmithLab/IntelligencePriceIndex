<text x="60.0" y="449.0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400">GEKS composite, annual mean. * 2026 is the trailing twelve months to 2026Q2. Read the order count as an UPPER BOUND on the decline: the IPI prices the listed</text>
<text x="60.0" y="462.0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="9.5" fill="#6b7280" text-anchor="start" font-weight="400">basic package, and 99% of recovered orders are above $50 against a listed median of $25-30, so realised price rose faster than the index.</text>
