<text x="60.0" y="34.0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1c2230" text-anchor="start" font-weight="700">Transactions are falling because dollars stopped growing and price did not</text>
<text x="60.0" y="54.0" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b7280" text-anchor="start" font-weight="400">Implied Fiverr order count over the IPI's time range. Index, 2020 = 100. Annual.</text>
